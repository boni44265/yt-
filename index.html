<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS Like &amp; Subscribe Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <main class="scene" aria-label="OBS green screen overlay">
      <section class="cta-wrap" aria-live="polite">
        <div class="glow glow-left"></div>
        <div class="glow glow-right"></div>
        <div class="cta-stage">

          <!-- Card 1 — Like -->
          <article class="cta-card like-card active" data-cta-card>
            <div class="icon-badge" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="presentation">
                <path d="M25 27V56H14a6 6 0 0 1-6-6V33a6 6 0 0 1 6-6h11Zm6 29V24.59L36.9 11a4.83 4.83 0 0 1 8.85 3.83L42 27h10.75A5.25 5.25 0 0 1 58 32.94l-4.4 17.6A7 7 0 0 1 46.81 56H31Z" />
              </svg>
            </div>
            <div class="cta-copy">
              <p class="eyebrow">If you're enjoying this</p>
              <h1>Smash that Like!</h1>
              <p class="supporting-text">It only takes a second and it really helps the channel grow. Thank you!</p>
            </div>
            <div class="status-pill">
              <span class="pill-emoji" aria-hidden="true">&#128077;</span> Like
            </div>
            <div class="progress-bar" aria-hidden="true"><div class="progress-fill"></div></div>
          </article>

          <!-- Card 2 — Subscribe -->
          <article class="cta-card subscribe-card" data-cta-card>
            <div class="icon-badge" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="presentation">
                <path d="M54.15 20.53a8.2 8.2 0 0 0-5.76-5.8C43.31 13.33 32 13.33 32 13.33s-11.31 0-16.39 1.4a8.2 8.2 0 0 0-5.76 5.8C8.5 25.65 8.5 32 8.5 32s0 6.35 1.35 11.47a8.2 8.2 0 0 0 5.76 5.8c5.08 1.4 16.39 1.4 16.39 1.4s11.31 0 16.39-1.4a8.2 8.2 0 0 0 5.76-5.8C55.5 38.35 55.5 32 55.5 32s0-6.35-1.35-11.47ZM27 40.13V23.87L41.27 32 27 40.13Z" />
              </svg>
            </div>
            <div class="cta-copy">
              <p class="eyebrow">Don't miss the next one</p>
              <h2>Subscribe &amp; Stay</h2>
              <p class="supporting-text">Hit subscribe and tap the bell so you never miss a new video. Welcome aboard!</p>
            </div>
            <div class="subscribe-button" role="presentation">
              <span class="pill-emoji" aria-hidden="true">&#128276;</span> Subscribe
            </div>
            <div class="progress-bar" aria-hidden="true"><div class="progress-fill"></div></div>
          </article>

        </div>
      </section>
    </main>

    <script src="overlay.js"></script>
  </body>
</html>
